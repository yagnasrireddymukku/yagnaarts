# Netlify build configuration — see docs/phase-15-deployment-guide.md for
# the full setup walkthrough (this is the recommended primary host: it
# serves from a true domain root, which src/components/header.html and
# footer.html's root-relative paths require — see the Phase 7 deployment
# path note).

[build]
  command = "npm run build"
  publish = "."

[build.environment]
  NODE_VERSION = "20"

# Every real page is a static .html file, so there's no SPA-style catch-all
# redirect here — only the two clean-URL cases the build script itself
# produces (folders with an index.html already satisfy trailing-slash
# requests natively; this just covers a bare 404 fallback).
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
