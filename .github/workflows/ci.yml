name: Build Check

# Runs the static site generator on every push/PR so a broken build (a bad
# template, invalid JSON in /data, a missing partial) is caught before it
# ever reaches production — independent of whichever host actually deploys
# the site (Netlify/Vercel/Cloudflare Pages all run their own build step
# separately; this is the safety net that runs regardless of host choice).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run the static site build
        run: node scripts/build.js

      - name: Verify no leftover template tags in the output
        run: |
          if grep -rlE '\{\{' --include="*.html" . | grep -v '^./src/'; then
            echo "::error::Unresolved {{...}} template tags found in generated output"
            exit 1
          fi
          echo "No leftover template tags — build output is clean."
