<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>(function(){var t=localStorage.getItem('ya-theme');if(t==='dark'||t==='light')document.documentElement.setAttribute('data-theme',t);})();</script>
<title>Search | YagnaArts</title>
<meta name="description" content="Search YagnaArts for personalized gifts, wedding keepsakes, home decor, and more.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0E3A5F">
<link rel="icon" type="image/png" sizes="32x32" href="/assets/images/brand/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/assets/images/brand/favicon-16.png">
<link rel="apple-touch-icon" sizes="180x180" href="/assets/images/brand/apple-touch-icon.png">
<link rel="preload" href="/fonts/playfair_normal_700.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/fonts/poppins_normal_400.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="preconnect" href="https://images.pexels.com">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link rel="stylesheet" href="/css/main.css">
<link rel="stylesheet" href="/css/pages/shop.css">
</head>
<body>

<!-- include:header -->

<main id="main">
  <section class="section" style="padding-top:2rem;">
    <div class="container">
      <h1 class="visually-hidden">Search YagnaArts</h1>
      <div class="form-field" style="max-width:520px; margin-bottom:2rem;">
        <input type="search" id="searchPageInput" placeholder=" " autocomplete="off">
        <label for="searchPageInput">Search for keychains, wedding gifts, pet portraits&hellip;</label>
      </div>

      <div id="searchPageStatus" data-search-status>
        <p class="text-muted">Start typing above to search the full catalog — results appear here instantly.</p>
      </div>

      <div class="shop-grid" data-search-results></div>
    </div>
  </section>
</main>

<!-- include:footer -->

<script type="module" src="/js/main.js"></script>
</body>
</html>
