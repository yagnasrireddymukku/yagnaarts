<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>(function(){var t=localStorage.getItem('ya-theme');if(t==='dark'||t==='light')document.documentElement.setAttribute('data-theme',t);})();</script>
<title>Frequently Asked Questions | YagnaArts</title>
<meta name="description" content="Answers to common questions about custom orders, shipping, care instructions, payments, and returns at YagnaArts.">
<link rel="canonical" href="https://yagnasrireddymukku.github.io/yagnaarts/pages/faq.html">
<meta name="theme-color" content="#0E3A5F">

<meta property="og:type" content="website">
<meta property="og:title" content="Frequently Asked Questions | YagnaArts">
<meta property="og:description" content="Answers to common questions about custom orders, shipping, care instructions, payments, and returns at YagnaArts.">
<meta property="og:image" content="https://images.pexels.com/photos/7256576/pexels-photo-7256576.jpeg?auto=compress&cs=tinysrgb&w=1200">
<meta property="og:url" content="https://yagnasrireddymukku.github.io/yagnaarts/pages/faq.html">
<meta property="og:site_name" content="YagnaArts">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Frequently Asked Questions | YagnaArts">
<meta name="twitter:description" content="Answers to common questions about custom orders, shipping, care instructions, payments, and returns at YagnaArts.">
<meta name="twitter:image" content="https://images.pexels.com/photos/7256576/pexels-photo-7256576.jpeg?auto=compress&cs=tinysrgb&w=1200">
<link rel="icon" type="image/png" sizes="32x32" href="/assets/images/brand/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/assets/images/brand/favicon-16.png">
<link rel="apple-touch-icon" sizes="180x180" href="/assets/images/brand/apple-touch-icon.png">
<link rel="preload" href="/fonts/playfair_normal_700.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/fonts/poppins_normal_400.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="preconnect" href="https://images.pexels.com">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link rel="stylesheet" href="/css/main.css">
</head>
<body>

<!-- include:header -->

<main id="main">
<div class="container" style="padding-top:1.5rem;">
  <nav aria-label="Breadcrumb">
    <ol class="breadcrumb">
      <li class="breadcrumb-item"><a href="/">Home</a></li>
      <li class="breadcrumb-item active" aria-current="page">FAQ</li>
    </ol>
  </nav>
</div>
  <section class="section">
    <div class="container" style="max-width:820px;">
      <div class="section-head section-head--center">
        <span class="eyebrow">Frequently Asked</span>
        <h1 class="section-title">Good to know before you order</h1>
      </div>
      <div>
        {{#each faqs}}
        <details class="faq-item">
          <summary>{{this.question}}<i class="bi bi-plus-lg accordion-icon" aria-hidden="true"></i></summary>
          <p>{{this.answer}}</p>
        </details>
        {{/each}}
      </div>

      <div style="text-align:center; margin-top:2.5rem;">
        <p class="text-muted">Still have a question?</p>
        <a class="btn btn-primary" href="/pages/contact.html">Contact Us</a>
      </div>
    </div>
  </section>
</main>

<!-- include:footer -->

<script type="module" src="/js/main.js"></script>
</body>
</html>
