<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>(function(){var t=localStorage.getItem('ya-theme');if(t==='dark'||t==='light')document.documentElement.setAttribute('data-theme',t);})();</script>
<title>{{title}} | YagnaArts Blog</title>
<meta name="description" content="{{excerpt}}">
<link rel="canonical" href="{{canonicalUrl}}">
<meta name="theme-color" content="#0E3A5F">

<meta property="og:type" content="article">
<meta property="og:title" content="{{title}} | YagnaArts Blog">
<meta property="og:description" content="{{excerpt}}">
<meta property="og:image" content="{{heroImage}}">
<meta property="og:url" content="{{canonicalUrl}}">
<meta property="og:site_name" content="YagnaArts">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{title}} | YagnaArts Blog">
<meta name="twitter:description" content="{{excerpt}}">
<meta name="twitter:image" content="{{heroImage}}">
{{{blogJsonLd}}}
<link rel="icon" type="image/png" sizes="32x32" href="/assets/images/brand/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/assets/images/brand/favicon-16.png">
<link rel="apple-touch-icon" sizes="180x180" href="/assets/images/brand/apple-touch-icon.png">
<link rel="preload" href="/fonts/playfair_normal_700.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/fonts/poppins_normal_400.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="preconnect" href="https://images.pexels.com">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link rel="stylesheet" href="/css/main.css">
<link rel="stylesheet" href="/css/pages/blog.css">
</head>
<body>

<!-- include:header -->

<main id="main">
  <div class="container" style="padding-top:1.5rem;">
    <nav aria-label="Breadcrumb">
      <ol class="breadcrumb">
        <li class="breadcrumb-item"><a href="/">Home</a></li>
        <li class="breadcrumb-item"><a href="/blog/">Blog</a></li>
        <li class="breadcrumb-item active" aria-current="page">{{title}}</li>
      </ol>
    </nav>
  </div>

  <section class="section" style="padding-top:1rem;">
    <div class="container" style="max-width:900px;">
      <span class="eyebrow">{{category}}</span>
      <h1 class="section-title" style="margin-top:.6rem; margin-bottom:1rem;">{{title}}</h1>
      <div class="blog-post-meta">
        <span><i class="bi bi-person" aria-hidden="true"></i> {{author}}</span>
        <span><i class="bi bi-calendar3" aria-hidden="true"></i> {{publishDate}}</span>
        <span><i class="bi bi-clock" aria-hidden="true"></i> {{readingTime}}</span>
      </div>

      <div class="blog-post-hero">
        <img src="{{heroImage}}" alt="{{title}}" width="1200" height="514" fetchpriority="high">
      </div>

      <article class="blog-post-body">
        {{{content}}}
      </article>
    </div>
  </section>

  {{#if relatedPosts}}
  <section class="section section-alt">
    <div class="container">
      <div class="section-head" style="margin-bottom:1.5rem;">
        <span class="eyebrow">Related Reading</span>
        <h2 class="section-title">More from the {{category}} category</h2>
      </div>
      <div class="blog-grid">
        {{#each relatedPosts}}{{> blog-post-card}}{{/each}}
      </div>
    </div>
  </section>
  {{/if}}
</main>

<!-- include:footer -->

<script type="module" src="/js/main.js"></script>
</body>
</html>
